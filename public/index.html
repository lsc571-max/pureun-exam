<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14285a">
<meta name="robots" content="noindex">
<title>푸른시험</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--navy:#14285a;--navy2:#2a4180;--blue:#2563eb;--sky:#e8f0ff;--accent:#f59e0b;--ink:#1f2937;--gray:#6b7280;--line:#d6deec;--bg:#eef2f9;
  --ok:#0f7a4d;--okbg:#e3f6ec;--no:#b3261e;--nobg:#fdebe9;--warnbg:#fff4dc;--warn:#7a4a06}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;word-break:keep-all;overflow-wrap:break-word;background:#0b1224;color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:16px;line-height:1.5}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;justify-content:center}
/* 학생 화면: 세로형 한 쪽 */
.phone{position:relative;width:100%;max-width:560px;height:100%;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.phone.dark{background:var(--navy);color:#fff}
.bar{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-weight:700;font-size:15px}
.bar .who{font-weight:500;font-size:13px;opacity:.9;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .clock{background:var(--accent);color:var(--navy);border-radius:99px;padding:2px 12px;font-variant-numeric:tabular-nums;font-size:16px;font-weight:900}
.bar .clock.low{background:#fecaca;color:#7f1d1d}
.bar button{color:#fff;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.14);font-size:13px;flex:none}
.prog{flex:none;height:5px;background:#e5e7eb}.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.body{flex:1;min-height:0;overflow:hidden auto;padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.body.center{justify-content:center}
.foot{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #eef1f6;background:#fff}
.dark .foot{background:transparent;border:0}
.chip{align-self:flex-start;background:var(--sky);color:var(--blue);font-weight:700;border-radius:99px;padding:3px 13px;font-size:14px}
.q{font-size:clamp(20px,5.4vw,25px);font-weight:900;color:var(--navy);line-height:1.38;letter-spacing:-.01em;white-space:pre-wrap}
.dark .q{color:#fff}
.h1{font-size:clamp(24px,6.5vw,30px);font-weight:900;line-height:1.25;letter-spacing:-.02em;color:var(--navy);text-wrap:balance}
.dark .h1{color:#fff}
.txt{font-size:17px;line-height:1.6;white-space:pre-wrap}
.sm{font-size:14px;color:var(--gray)}.dark .sm{color:#c7d6ff}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid #d1d5db;border-radius:14px;padding:13px 14px;
  font-size:clamp(17px,4.6vw,19px);line-height:1.4;background:#fff;min-height:54px}
.opt .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:2px solid #9ca3af;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;color:#4b5563}
.opt.on{border-color:var(--blue);background:var(--sky);font-weight:700;color:var(--navy)}
.opt.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nobg)}.opt.wrong .n{background:var(--no);border-color:var(--no);color:#fff}
.opt .tag{margin-left:auto;flex:none;font-size:13px;font-weight:700}
.btn{flex:1;text-align:center;border-radius:13px;padding:13px 10px;font-weight:700;background:var(--navy);color:#fff;font-size:17px;min-height:50px}
.btn.gh{background:#eef3fc;color:var(--navy)}.btn.am{background:var(--accent);color:var(--navy)}.btn.red{background:var(--no);color:#fff}
.btn:disabled{background:#d1d5db;color:#6b7280}
.btn.s{flex:none;padding:8px 14px;font-size:14px;min-height:0;border-radius:10px}
.in{width:100%;border:2px solid #d1d5db;border-radius:13px;padding:13px 14px;background:#fff;color:var(--ink);font-size:18px}
.in:focus{border-color:var(--blue);outline:0}
textarea.in{resize:none;line-height:1.55}
.ta{flex:1;min-height:150px}
.pic{flex:none;border-radius:14px;overflow:hidden;background:#eef2f9;cursor:zoom-in;max-height:38vh;display:flex;justify-content:center}
.pic img{max-width:100%;max-height:38vh;object-fit:contain;display:block;pointer-events:none}
.vid{flex:none;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid iframe,.vid video{width:100%;height:100%;border:0;display:block}
.box{border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.55;white-space:pre-wrap}
.box.warn{background:var(--warnbg);color:var(--warn)}.box.ok{background:var(--okbg);color:#0b5a39}.box.no{background:var(--nobg);color:#8a1c16}.box.info{background:var(--sky);color:var(--navy)}
.box b{font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 40%;border-radius:13px;padding:13px;font-weight:900;font-size:19px;background:rgba(255,255,255,.14);color:#fff;border:2px solid transparent}
.seg button.on{background:var(--accent);color:var(--navy)}
.check{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid #d1d5db;border-radius:14px;padding:14px;font-size:18px;font-weight:700;background:#fff}
.check i{flex:none;width:26px;height:26px;border:2px solid #9ca3af;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff}
.check.on{border-color:var(--ok);background:var(--okbg)}.check.on i{background:var(--ok);border-color:var(--ok)}
ul.rules{padding-left:22px;font-size:17px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{aspect-ratio:1;border-radius:12px;background:#eef3fc;color:var(--navy);font-weight:700;font-size:17px;border:2px solid transparent}
.grid button.on{background:var(--navy);color:#fff}.grid button.cur{border-color:var(--accent)}
.grid button.right{background:var(--okbg);color:var(--ok)}.grid button.wrong{background:var(--nobg);color:var(--no)}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;box-shadow:0 1px 3px rgba(20,40,90,.06)}
.card h3{font-size:19px;font-weight:900;color:var(--navy)}
.card .st{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:1px 10px;margin-bottom:6px;background:#eef3fc;color:var(--navy)}
.st.run{background:var(--okbg);color:var(--ok)}.st.wait{background:var(--warnbg);color:var(--warn)}.st.end{background:#e5e7eb;color:#374151}
.big{font-size:52px;font-weight:900;color:var(--navy);line-height:1}.big small{font-size:18px;font-weight:700}
.save{font-size:13px;color:var(--gray)}.save.off{color:var(--no);font-weight:700}
.link{color:#c7d6ff;text-decoration:underline;font-size:14px;padding:6px}
/* 겹쳐 뜨는 창 */
#modal,#zoom,#guard{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(11,18,36,.72);padding:18px}
#guard{z-index:60;background:rgba(11,18,36,.96)}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow:auto;background:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet.wide{max-width:860px}
.sheet h2{font-size:21px;font-weight:900;color:var(--navy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* AI 부탁문 묶음: 다른 버튼과 구별되게 */
.ask{background:var(--warnbg);border:2px solid var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ask-t{font-weight:900;color:var(--navy);font-size:16px}.ask-t span{font-weight:500;font-size:13px;color:var(--warn);margin-left:6px}
/* 고치기 창: 저장·취소를 맨 위에 붙여 두어 내리지 않아도 누를 수 있게 */
.edbar{position:sticky;top:-22px;z-index:2;display:flex;gap:8px;align-items:center;background:#fff;margin:-22px -22px 0;padding:16px 22px 12px;border-bottom:1px solid var(--line);border-radius:20px 20px 0 0}
.edbar h2{margin-right:auto}
#zoom{background:#000;padding:0;overflow:auto;display:block;cursor:zoom-out;z-index:55}
#zoom img{display:block;width:100%;height:auto;min-height:100%;object-fit:contain}
#zoom.z img{width:250%;max-width:none;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#111827;color:#fff;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:700;max-width:92vw;text-align:center}
/* 시험 중: 드래그·복사·길게 누르기 차단 (입력 칸만 허용) */
.lock,.lock *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lock textarea,.lock input{-webkit-user-select:text;user-select:text}
.lock img{-webkit-user-drag:none}
/* 교수 화면 */
.desk{width:100%;height:100%;background:var(--bg);overflow:auto}
.desk header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.desk header h1{font-size:18px;font-weight:900;margin-right:auto;min-width:0}
.desk header button{color:#fff;background:rgba(255,255,255,.14);border-radius:9px;padding:6px 11px;font-size:14px;font-weight:700}
.desk main{max-width:1080px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;background:#fff;color:var(--navy);border:1px solid var(--line)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:18px;font-weight:900;color:var(--navy)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e8edf6;vertical-align:top}
th{font-size:13px;color:var(--gray);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--sky);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:24px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--gray)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:0 9px;border-radius:99px;background:#eef3fc;color:var(--navy);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--nobg);color:var(--no)}.pill.mid{background:var(--warnbg);color:var(--warn)}
.meter{height:9px;border-radius:9px;background:#e5e7eb;min-width:70px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}.meter i.low{background:var(--no)}
.qrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.qrow.err{border-color:var(--no);background:var(--nobg)}
.qrow input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none}
.qrow .t{flex:1;min-width:0}.qrow .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .t span{font-size:13px;color:var(--gray)}
.mini{border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;background:#eef3fc;color:var(--navy);flex:none}
.mini.red{background:var(--nobg);color:var(--no)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--gray)}
label.f .in{font-size:16px;padding:9px 11px;border-radius:10px;font-weight:400}
.scores{display:flex;gap:5px;flex-wrap:wrap}
.scores button{min-width:38px;border-radius:9px;padding:7px 4px;font-weight:700;background:#eef3fc;color:var(--navy)}
.scores button.on{background:var(--navy);color:#fff}
pre.code{background:#f3f6fb;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;overflow:auto;max-height:240px;white-space:pre-wrap}
@media(min-width:561px){.phone{box-shadow:0 0 30px rgba(0,0,0,.35)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="phone dark"><div class="body center" style="align-items:center"><div class="h1">푸른시험</div><div class="sm" id="bootmsg">불러오는 중…</div></div></div></div>
<div id="modal" hidden></div>
<div id="zoom" hidden><img alt=""></div>
<div id="guard" hidden></div>
<div id="toast" hidden></div>
<noscript>자바스크립트를 켜야 시험을 볼 수 있습니다.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
