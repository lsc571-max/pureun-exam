name: 안드로이드 앱 만들기
# (서명 열쇠는 저장소 비밀값 ANDROID_KEYSTORE_BASE64 — 같은 열쇠여야 앱 안 업데이트로 덮어 설치됨)
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # 만든 APK를 Releases 에 올리기 위해

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    name: APK 빌드와 내려받기 주소 갱신
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: 서명 열쇠 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/pureun-exam.p12
            echo "저장해 둔 서명 열쇠를 씁니다."
          else
            keytool -genkeypair -keystore android/pureun-exam.p12 -storetype PKCS12 -storepass pureun-exam -keypass pureun-exam \
              -alias pureun -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Pureun Exam, O=Pureun"
            echo "::warning::서명 열쇠 비밀값(ANDROID_KEYSTORE_BASE64)이 없어 임시 열쇠로 만들었습니다. 이 APK 위에는 다음 빌드를 덮어 설치할 수 없습니다(지우고 다시 설치)."
          fi
      - name: 빌드
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: 파일 이름 정리와 서명 확인
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pureun-exam.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs pureun-exam.apk | head -3
          ls -la pureun-exam.apk
      - uses: actions/upload-artifact@v4
        with: { name: pureun-exam-apk, path: pureun-exam.apk }
      - name: 내려받기 주소 갱신 (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag 2>/dev/null || true
          echo "${{ github.run_number }}" > version.txt   # 앱이 새 버전이 있는지 확인하는 번호(= versionCode)
          gh release create app pureun-exam.apk version.txt --latest \
            --title "푸른시험 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "안드로이드 휴대폰에서 pureun-exam.apk 를 눌러 내려받아 설치하세요. 새 빌드가 나오면 이 파일이 바뀝니다."
