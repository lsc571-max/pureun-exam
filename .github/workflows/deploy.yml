name: 테스트 후 배포
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: 자동 테스트 (채점 · 랜덤 · 저장 · 보안 규칙 · 화면)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: 채점 · 랜덤 · 저장 테스트
        run: npm test
      - name: 보안 규칙 테스트 (Firebase 에뮬레이터)
        run: npm run test:rules
      - name: 화면 테스트 (브라우저)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  deploy:
    name: Firebase 배포 (화면 + 보안 규칙)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 배포 열쇠 확인
        id: key
        env:
          HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUREUN_EXAM != '' }}
        run: |
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::warning::GitHub 비밀값 FIREBASE_SERVICE_ACCOUNT_PUREUN_EXAM 이 없어서 배포를 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 배포
        if: steps.key.outputs.ok == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUREUN_EXAM }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only hosting,database --project pureun-exam --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
